<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Haven | Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header>

    <div class="brand">

        <img
            src="images/logo.png"
            alt="Book Haven Logo"
            class="logo-map"
            usemap="#loginMap"
        >

        <map name="loginMap">

            <area
                shape="rect"
                coords="0,0,250,100"
                href="aboutus.html"
                alt="About Book Haven"
            >

        </map>

        <div>

            <h1>Book Haven</h1>

        </div>

    </div>


    <nav>

        <ul>

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="books.html">Books</a>
            </li>

            <li>
                <a href="signup.html">Sign Up</a>
            </li>

            <li>
                <a class="active" href="login.html">Login</a>
            </li>

            <li>
                <a href="aboutus.html">About Us</a>
            </li>

        </ul>

    </nav>

</header>


<main>

    <section class="auth-page">

        <div class="form-card">

            <div class="form-logo">

                <img
                    src="images/logo.png"
                    alt="Book Haven"
                >

            </div>


            <span class="section-label">
                WELCOME BACK
            </span>


            <h2>Login to Book Haven</h2>


            <form id="login-form" novalidate>

                <div class="form-group">

                    <label for="login-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn primary-btn full-width">
                    Login
                </button>


                <button
                    type="button"
                    id="logout-btn"
                    class="btn secondary-btn full-width">
                    Logout
                </button>


                <p
                    id="login-message"
                    class="form-message">
                </p>

            </form>


            <p class="form-footer-text">

                Don't have an account?

                <a href="signup.html">
                    Create one here
                </a>

            </p>

        </div>

    </section>

</main>

<footer>

    <div class="footer-bottom">

        <p>
            &copy; 2026 Book Haven. All Rights Reserved.
        </p>

    </div>

</footer>


<script src="script.js"></script>

</body>
</html>
