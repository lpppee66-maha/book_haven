
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Haven | About Us</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a class="brand" href="index.html">
            <img src="images/logo.png" alt="Book Haven Logo">
            <span>Book Haven</span>
        </a>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="signup.html" class="active">Sign Up</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="products.html">Books</a></li>               
                <li><a href="aboutus.html">About Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-page reveal">
        <form id="signupForm" class="pretty-form glass-card">
            <h1>Sign Up</h1>

            <label for="fullName">Full Name</label>
            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                required
            >

            <label for="signupEmail">Email Address</label>
            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                required
            >

            <label for="signupPassword">Password</label>
            <input
                type="password"
                id="signupPassword"
                placeholder="Create a password"
                required
                minlength="6"
            >

            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
                minlength="6"
            >

            <button type="submit" class="primary-btn full-btn">
                Create Account
            </button>
            <p class="signup-login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
            <p id="signupMessage" class="status-message"></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Special Gift. Custom Design Co.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
